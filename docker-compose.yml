services:
  api:
    build: .
    environment:
      AERIS_ENV: ${AERIS_ENV:-development}
      DATABASE_URL: postgresql+psycopg://aeris:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/aeris
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  migrate:
    build: .
    environment:
      AERIS_ENV: ${AERIS_ENV:-development}
      DATABASE_URL: postgresql+psycopg://aeris:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/aeris
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aeris
      POSTGRES_USER: aeris
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aeris -d aeris"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
