name: AERIS-X quality

"on":
  push: {}
  pull_request: {}

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      DATABASE_URL: sqlite:///ci_migration.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall src scripts tests alembic -q
      - run: python -m pytest tests/test_phase14a_foundation.py tests/test_phase14b_integration.py tests/test_phase14c_telemetry.py tests/test_phase14d_operational.py tests/test_phase14e_monitoring.py tests/test_phase15_runtime.py -q
      - run: alembic upgrade head
      - run: python scripts/validate_roadmap.py
      - run: python scripts/check_build_gate.py 13
      - name: Verify protected paths are unchanged
        shell: bash
        run: |
          test -z "$(git diff --name-only -- reports/experiments data/processed models .aeris/state.json)"
